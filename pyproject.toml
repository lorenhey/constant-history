[project]
name = "constant-history"
version = "2.0.0"
description = "A computable history of how physics learned to measure its constants, with interactive web timeline, uncertainty plots, and 2019 SI redefinition explorer."
authors = [{name = "Lorenzo Pérez", email = "lorenhey@example.com"}]
dependencies = [
    "pydantic",
    "typer",
    "rich",
    "pandas",
    "plotly",
    "fastapi",
    "uvicorn",
]

[project.scripts]
chist = "constant_history.cli:main"
constant-history = "constant_history.cli:main"
chist-web = "constant_history.web:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
